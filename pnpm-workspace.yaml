packages:
  - apps/*
  - packages/*
overrides:
  "undici@<6.28.1": "6.28.1"
  "ws@>=8 <8.21.3": "8.21.3"
  "axios@>=1 <1.18.0": "1.20.0"
  "uuid@>=8 <11.1.1": "11.1.1"
allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true
  supabase: true
  "@tailwindcss/oxide": true
  "@reown/appkit": false
  bufferutil: false
  keccak: false
  utf-8-validate: false
minimumReleaseAgeExclude:
